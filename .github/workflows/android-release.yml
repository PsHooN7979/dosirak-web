name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/dosirak-release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=dosirak-release.jks
          EOF

      - name: Build APK
        run: flutter build apk --release

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/dosirak-${{ steps.get_version.outputs.VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: "도시락 ${{ steps.get_version.outputs.VERSION }}"
          body: |
            ## 도시락 앱 ${{ steps.get_version.outputs.VERSION }}

            ### 설치 방법
            1. 아래 `dosirak-${{ steps.get_version.outputs.VERSION }}.apk` 파일을 다운로드하세요.
            2. Android 기기에서 파일을 열어 설치하세요.
            3. 설치 전 설정 > 보안 > **출처를 알 수 없는 앱 허용**을 켜주세요.
          files: build/app/outputs/flutter-apk/dosirak-${{ steps.get_version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
